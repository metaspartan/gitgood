name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: git lfs install
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:web
      - run: bun run test
