name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sudo apt-get install -y git-lfs unzip && git lfs install
      - run: git config --global user.name ci && git config --global user.email ci@example.test
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:web
      - run: bun tests/fixtures/make-large-repo.ts
      - run: bun run test
